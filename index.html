<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Define a codificação de caracteres -->
    <meta charset="UTF-8">

    <!-- Ajusta a página para diferentes tamanhos de tela -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título que aparece na aba do navegador -->
    <title>Meus sites favoritos</title>

    <!-- Estilos da página -->
    <style>
        /* Configura a aparência geral */
        body {
            font-family: Arial, sans-serif;
            background-color: #fce4ec;
            color: #333;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        /* Título principal */
        h1 {
            color: #ad1457;
        }

        /* Organiza os sites em cartões */
        .sites {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        /* Aparência de cada site */
        .site {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            width: 220px;
            box-shadow: 0 2px 6px #00000020;
        }

        /* Nome de cada site */
        h2 {
            color: #880e4f;
            font-size: 20px;
        }

        /* Imagens dos sites */
        img {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }

        /* Links */
        a {
            color: #c2185b;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- Título principal da página -->
    <h1>Meus sites favoritos: Joseane Sabino</h1>

    <!-- Área que contém os cinco sites favoritos -->
    <div class="sites">

        <!-- Site 1: Stardew Valley Wiki -->
        <div class="site">
            <h2>Stardew Valley Wiki</h2>

            <!-- Imagem do site -->
            <a href="https://stardewvalleywiki.com/Stardew_Valley_Wiki"
               target="_blank">
                <img
                    src="https://www.google.com/s2/favicons?domain=stardewvalleywiki.com&sz=128"
                    alt="Ícone da Stardew Valley Wiki">
            </a>

            <!-- Link para acessar o site -->
            <p>
                <a href="https://stardewvalleywiki.com/Stardew_Valley_Wiki"
                   target="_blank">
                    Acessar site
                </a>
            </p>
        </div>

        <!-- Site 2: Wiki Naruto -->
        <div class="site">
            <h2>Wiki Naruto</h2>

            <!-- Imagem do site -->
            <a href="https://naruto.fandom.com/pt-br/wiki/Wiki_Naruto"
               target="_blank">
                <img
                    src="https://www.google.com/s2/favicons?domain=naruto.fandom.com&sz=128"
                    alt="Ícone da Wiki Naruto">
            </a>

            <!-- Link para acessar o site -->
            <p>
                <a href="https://naruto.fandom.com/pt-br/wiki/Wiki_Naruto"
                   target="_blank">
                    Acessar site
                </a>
            </p>
        </div>

        <!-- Site 3: YouTube -->
        <div class="site">
            <h2>YouTube</h2>

            <!-- Imagem do site -->
            <a href="https://www.youtube.com"
               target="_blank">
                <img
                    src="https://www.google.com/s2/favicons?domain=youtube.com&sz=128"
                    alt="Ícone do YouTube">
            </a>

            <!-- Link para acessar o site -->
            <p>
                <a href="https://www.youtube.com"
                   target="_blank">
                    Acessar site
                </a>
            </p>
        </div>

        <!-- Site 4: Canva -->
        <div class="site">
            <h2>Canva</h2>

            <!-- Imagem do site -->
            <a href="https://www.canva.com"
               target="_blank">
                <img
                    src="https://www.google.com/s2/favicons?domain=canva.com&sz=128"
                    alt="Ícone do Canva">
            </a>

            <!-- Link para acessar o site -->
            <p>
                <a href="https://www.canva.com"
                   target="_blank">
                    Acessar site
                </a>
            </p>
        </div>

        <!-- Site 5: Google -->
        <div class="site">
            <h2>Google</h2>

            <!-- Imagem do site -->
            <a href="https://www.google.com"
               target="_blank">
                <img
                    src="https://www.google.com/s2/favicons?domain=google.com&sz=128"
                    alt="Ícone do Google">
            </a>

            <!-- Link para acessar o site -->
            <p>
                <a href="https://www.google.com"
                   target="_blank">
                    Acessar site
                </a>
            </p>
        </div>

    </div>

</body>
</html>
